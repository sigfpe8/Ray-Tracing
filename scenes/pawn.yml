# https://github.com/MitchelPaulin/RayTracer/blob/main/obj/pawn-chess.obj

- add: camera
  width: 1000
  height: 1000
  field-of-view: PI/3
  from: [0, 4, -5]
  to: [0, 2, 0]
  up: [0, 1, 0]

- add: point-light
  at: [-7, 11, -10]
  intensity: [1, 1, 1]

- add: group
  obj: pawn.obj
  material:
    color: [ 0.8, 0.8, 0.9 ]
    ambient: 0.1
    diffuse: 0.1
    specular: 1.0
    shininess: 300
    transparency: 1.0
    refractive-index: 1.52
    reflective: 0.1

# floor
- add: plane
  material:
    pattern:
      type: checkers
      colors:
        - [0.1, 0.1, 0.1]
        - [0.9, 0.9, 0.9]
