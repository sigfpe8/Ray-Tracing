- add: camera
  width: 600
  height: 400
  field-of-view: PI/6
  from: [0, 15, -15]
  to: [0, 1, 0]
  up: [0, 1, 0]

- add: point-light
  at: [-30, 20, -30]
  intensity: [1, 1, 1]

- add: group
  obj: pumpkin.obj
  transform:
    - [ scale, 0.1, 0.1, 0.1 ]
    - [ translate, 0, 0, 8 ]
    - [ rotate-x, PI/2 ]
  material:
    color: [ 1, 0.46, 0.09 ]

# floor
- add: plane
  # transform:
  #   - [ rotate-y, 0.31415 ]
  material:
    pattern:
      type: checkers
      colors:
        - [0.00, 0.00, 0.00]
        - [0.75, 0.75, 0.75]
    ambient: 0.5
    diffuse: 0.4
    specular: 0.8
    reflective: 0.1
